<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">PuzHub puzzle mark</title>
  <desc id="desc">A dimensional eight-tile sliding puzzle in PuzHub's teal, mint, peach and sky palette.</desc>
  <defs>
    <linearGradient id="logo-bg" x1="62" y1="40" x2="452" y2="478" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D7778"/>
      <stop offset=".52" stop-color="#10545B"/>
      <stop offset="1" stop-color="#103A43"/>
    </linearGradient>
    <linearGradient id="board-light" x1="115" y1="94" x2="397" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".98"/>
      <stop offset="1" stop-color="#DDEFE6" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="tile-teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67D4CA"/><stop offset="1" stop-color="#087D89"/>
    </linearGradient>
    <linearGradient id="tile-mint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E2F8E9"/><stop offset="1" stop-color="#8FD5BB"/>
    </linearGradient>
    <linearGradient id="tile-peach" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFE8CB"/><stop offset="1" stop-color="#F3AD83"/>
    </linearGradient>
    <linearGradient id="tile-cream" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#DDEFE5"/>
    </linearGradient>
    <filter id="board-shadow" x="58" y="49" width="396" height="418" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="tile-shadow" x="-25%" y="-20%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#103D43" flood-opacity=".3"/>
    </filter>
  </defs>

  <!-- A calm, high-contrast badge keeps the mark legible on either theme. -->
  <rect x="16" y="16" width="480" height="480" rx="146" fill="url(#logo-bg)"/>
  <circle cx="397" cy="104" r="102" fill="#8CE0C6" fill-opacity=".1"/>
  <circle cx="117" cy="396" r="104" fill="#72C7B4" fill-opacity=".08"/>
  <path d="M90 414c92 47 238 47 332-5" stroke="#D5F4E5" stroke-opacity=".16" stroke-width="7" stroke-linecap="round"/>

  <!-- Floating glass board, echoing the splash-screen centerpiece. -->
  <g transform="rotate(-7 256 256)">
    <rect x="91" y="89" width="330" height="330" rx="59" fill="#061F27" fill-opacity=".52" filter="url(#board-shadow)"/>
    <rect x="91" y="82" width="330" height="330" rx="59" fill="#A9CEBB" fill-opacity=".36"/>
    <rect x="91" y="74" width="330" height="330" rx="59" fill="url(#board-light)" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="3"/>

    <g filter="url(#tile-shadow)">
      <g transform="translate(125 106)">
        <rect y="7" width="70" height="70" rx="19" fill="#07636E"/>
        <rect width="70" height="70" rx="19" fill="url(#tile-teal)" stroke="#FFFFFF" stroke-opacity=".48" stroke-width="2"/>
        <path d="M25 35h20M35 25v20" stroke="#F4FFF7" stroke-width="6" stroke-linecap="round" opacity=".94"/>
      </g>
      <g transform="translate(220 106)">
        <rect y="7" width="70" height="70" rx="19" fill="#91BBA6"/>
        <rect width="70" height="70" rx="19" fill="url(#tile-cream)" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="2"/>
        <path d="M25 35h20" stroke="#527D6D" stroke-width="6" stroke-linecap="round" opacity=".75"/>
      </g>
      <g transform="translate(315 106)">
        <rect y="7" width="70" height="70" rx="19" fill="#91BBA6"/>
        <rect width="70" height="70" rx="19" fill="url(#tile-mint)" stroke="#FFFFFF" stroke-opacity=".72" stroke-width="2"/>
        <path d="M25 35h20" stroke="#43806A" stroke-width="6" stroke-linecap="round" opacity=".7"/>
      </g>
      <g transform="translate(125 201)">
        <rect y="7" width="70" height="70" rx="19" fill="#C98C6B"/>
        <rect width="70" height="70" rx="19" fill="url(#tile-peach)" stroke="#FFFFFF" stroke-opacity=".72" stroke-width="2"/>
        <path d="M25 35h20" stroke="#9B6548" stroke-width="6" stroke-linecap="round" opacity=".78"/>
      </g>
      <g transform="translate(315 201)">
        <rect y="7" width="70" height="70" rx="19" fill="#AFCDBD"/>
        <rect width="70" height="70" rx="19" fill="url(#tile-cream)" stroke="#FFFFFF" stroke-opacity=".82" stroke-width="2"/>
        <path d="M25 35h20" stroke="#527D6D" stroke-width="6" stroke-linecap="round" opacity=".75"/>
      </g>
      <g transform="translate(125 296)">
        <rect y="7" width="70" height="70" rx="19" fill="#AFCDBD"/>
        <rect width="70" height="70" rx="19" fill="url(#tile-cream)" stroke="#FFFFFF" stroke-opacity=".82" stroke-width="2"/>
        <path d="M25 35h20" stroke="#527D6D" stroke-width="6" stroke-linecap="round" opacity=".75"/>
      </g>
      <g transform="translate(220 296)">
        <rect y="7" width="70" height="70" rx="19" fill="#6BAA91"/>
        <rect width="70" height="70" rx="19" fill="url(#tile-mint)" stroke="#FFFFFF" stroke-opacity=".68" stroke-width="2"/>
        <path d="m22 37 9 9 18-21" stroke="#287A62" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="translate(315 296)">
        <rect y="7" width="70" height="70" rx="19" fill="#07636E"/>
        <rect width="70" height="70" rx="19" fill="url(#tile-teal)" stroke="#FFFFFF" stroke-opacity=".48" stroke-width="2"/>
        <path d="M25 35h20" stroke="#F4FFF7" stroke-width="6" stroke-linecap="round" opacity=".94"/>
      </g>
    </g>
    <g transform="translate(220 201)">
      <rect x="5" y="5" width="60" height="60" rx="17" fill="#D3E7DA" fill-opacity=".48" stroke="#86B9A4" stroke-opacity=".72" stroke-width="2.5" stroke-dasharray="7 7"/>
      <circle cx="35" cy="35" r="4" fill="#6DAE9A" fill-opacity=".7"/>
    </g>
  </g>

  <g fill="#FFE0B7">
    <path d="m382 183 4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
    <circle cx="103" cy="167" r="6" fill-opacity=".8"/>
    <circle cx="394" cy="358" r="5" fill-opacity=".68"/>
  </g>
  <path d="M103 286v15m-7.5-7.5h15" stroke="#A9E8D0" stroke-width="3" stroke-linecap="round" opacity=".78"/>
</svg>
