<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" role="img" aria-labelledby="t d">
<title id="t">PuzHub dimensional puzzle tiles</title><desc id="d">Original layered teal, mint, peach and sky puzzle tiles floating above a soft board.</desc>
<defs>
 <linearGradient id="board" x1="90" y1="64" x2="494" y2="444" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#DDEDE3"/></linearGradient>
 <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38C5B5"/><stop offset="1" stop-color="#087E8B"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D9F9E8"/><stop offset="1" stop-color="#83CBB0"/></linearGradient>
 <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE6BE"/><stop offset="1" stop-color="#EFA77E"/></linearGradient>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#CDEAF0"/><stop offset="1" stop-color="#81BDCE"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E2D5FA"/><stop offset="1" stop-color="#A397D1"/></linearGradient>
 <filter id="sh" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#31564B" flood-opacity=".22"/></filter>
 <radialGradient id="soft"><stop stop-color="#B9E1D2" stop-opacity=".6"/><stop offset="1" stop-color="#B9E1D2" stop-opacity="0"/></radialGradient>
</defs>
